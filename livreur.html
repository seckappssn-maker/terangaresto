<style>

@media (prefers-reduced-motion:reduce){.spin{animation:none}}

const qrOk=u=>typeof u==='string'&&/^https:\/\//.test(u);

    (+o.du>0?(PAYW[o.id]?payBox(o):'<div class="cash due">💰 À encaisser : '+F(o.du)+'</div>'+(PM.length?'<button class="btn sm" data-a="qr" data-id="'+esc(o.id)+'">📱 Le client paie par '+(PM.length>1?'Wave / Orange Money':PM[0]==='om'?'Orange Money':'Wave')+'</button>':'')):'<div class="cash paid">✅ Déjà payé : rien à encaisser</div>')+
    (o.livPart?'':'<button class="btn go big" data-a="route" data-id="'+esc(o.id)+'"'+(BUSY?' disabled':'')+'>🛵 Je pars avec la commande</button>')+
    '<button class="btn ok big" data-a="livre" data-id="'+esc(o.id)+'"'+(BUSY?' disabled':'')+'>'+(ar==='livre:'+o.id?'Sûr ? Touchez encore':'✅ LIVRÉ'+(pw?' · payé par '+(pw==='om'?'OM':'Wave'):+o.du>0?' · j\'encaisse '+F(o.du):''))+'</button>'+
    '<button class="btn warn sm" style="margin-top:8px" data-a="retour" data-id="'+esc(o.id)+'"'+(BUSY?' disabled':'')+'>'+(ar==='retour:'+o.id?'Sûr ? Touchez encore':'Client absent : je reviens')+'</button></article>'}
function renderLogin(A){const last=lsGet('trliv-last-'+CODE,{});
  A.innerHTML='<form class="card" id="fLog"><b style="font-size:19px">Entrez dans votre espace</b><div class="hint">Le restaurant vous a envoyé un code de 4 chiffres sur WhatsApp.</div>'+
    '<label class="f">Mon numéro<input id="l_tel" inputmode="tel" autocomplete="tel" value="'+esc(last.tel||'')+'" placeholder="77 123 45 67"></label>'+
    '<label class="f">Mon code (4 chiffres)<input id="l_pin" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="••••"></label>'+
    '<div class="err" id="l_err" role="alert"></div><button class="btn go big" id="l_btn" type="submit">Entrer</button></form>'}
/* ---------- Avis sur le téléphone ---------- */
function pushOk(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
function pushCard(){return '<h2>Avis sur ce téléphone</h2><div class="card" id="pushbox"><span class="spin"></span></div>'}
async function pushSub(){try{const r=await navigator.serviceWorker.getRegistration();return r?await r.pushManager.getSubscription():null}catch(e){return null}}
async function pushPaint(){const b=$('pushbox');if(!b)return;
  if(DEMO){b.innerHTML='<div class="hint">Avec votre vrai accès, le téléphone sonne à chaque nouvelle livraison, même fermé.</div>';return}
  if(isIOS&&!isHome()){b.innerHTML='<div><b>Pour être prévenu même téléphone fermé :</b></div><div class="hint">Dans Safari touchez <b>Partager</b> (le carré avec la flèche) → <b>Sur l\'écran d\'accueil</b>. Ouvrez l\'espace depuis la nouvelle icône, puis revenez ici.</div>';return}
  if(!pushOk()){b.innerHTML='<div class="hint">Ce navigateur ne reçoit pas les avis. Gardez la page ouverte : elle sonne quand une livraison arrive.</div>';return}
  const s=Notification.permission==='granted'?await pushSub():null;
  b.innerHTML=s?'<div>🔔 <b>Avis activés</b> : vous êtes prévenu même téléphone fermé.</div><button class="btn sm" style="margin-top:10px" data-a="ptest">Envoyer un avis de test</button>'
    :'<div class="hint">Le téléphone sonne à chaque nouvelle livraison, même fermé.</div><button class="btn go" data-a="pon">🔔 Activer les avis</button>'}
function b64u(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s);return Uint8Array.from(r,c=>c.charCodeAt(0))}
async function pushOn(){try{const p=await Notification.requestPermission();if(p!=='granted'){toast('Avis refusés : autorisez-les dans les réglages du téléphone');return}
  let r=await navigator.serviceWorker.getRegistration();if(!r)r=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
  let s=await r.pushManager.getSubscription();if(!s)s=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(PUSH_PUB)});
  const x=await rpc('resto_liv_push_save',{p_code:CODE,p_tel:ACC.tel,p_pin:ACC.pin,p_sub:s.toJSON()});if(!x||!x.ok)throw new Error(x&&x.erreur||'Erreur');
  toast('Avis activés ✅');await rpc('resto_liv_push_test',{p_code:CODE,p_tel:ACC.tel,p_pin:ACC.pin});pushPaint()}catch(e){toast('Je n\'arrive pas à activer les avis : '+errMsg(e))}}
async function pushResync(){try{if(DEMO||!ACC||!pushOk()||Notification.permission!=='granted')return;const s=await pushSub();if(s)rpc('resto_liv_push_save',{p_code:CODE,p_tel:ACC.tel,p_pin:ACC.pin,p_sub:s.toJSON()}).catch(()=>{})}catch(e){}}
/* ---------- Lecture et actions ---------- */
function setV(v,notify){if(!v||!v.ok)return;const ids=new Set((v.orders||[]).filter(o=>!o.livFait).map(o=>o.id+':'+o.statut));
  if(notify&&seen){let nv=0;ids.forEach(k=>{if(!seen.has(k))nv++});if(nv){ding();toast('Nouvelle livraison ou commande prête')}}
  seen=ids;V=v;lsSet(KEY+'-v',v);homeIcon(v.resto&&v.resto.nom)}
async function load(notify){if(DEMO){setV(demoVue());render();return}
  if(!ACC)return;try{const v=await rpc('resto_liv',{p_code:CODE,p_tel:ACC.tel,p_pin:ACC.pin});
    if(!v||!v.ok){lsSet(KEY,null);ACC=null;V=null;render();toast(v&&v.erreur||'Votre accès a changé : entrez de nouveau');return}
    setV(v,notify);if(!BUSY)render()}
  catch(e){const m=errMsg(e);if(/fermé|formule/i.test(m)){$('app').innerHTML='<div class="card"><b>'+esc(m)+'</b><div class="hint">Appelez le restaurant.</div></div>';return}if(!V)render();toast(m)}}
function poll(){clearTimeout(timer);timer=setTimeout(async()=>{if(document.visibilityState==='visible'&&!BUSY)await load(true);poll()},15000)}
async function act(a,id){const pay=a==='livre'&&PAYW[id]?PAYW[id]:'',pnm=pay==='om'?'Orange Money':'Wave';
  if(DEMO){const o=V.orders.find(x=>x.id===id);if(o){const t=new Date().toISOString();if(a==='route')o.livPart=t;if(a==='livre'){o.livFait=t;if(pay&&+o.du>0){o.livPay=pay;o.livPayM=o.du;o.livDu=0}else o.livDu=o.du}if(a==='retour'){o.livRetour=t;o.livPart=null}}if(a==='livre')delete PAYW[id];ARM='';render();toast('Exemple : rien n\'est envoyé');return}
  BUSY=true;render();try{const v=await call(a,id,pay?{pay}:{});if(a==='livre')delete PAYW[id];setV(v);toast(a==='livre'?(pay?'Livraison notée ✓ · payé par '+pnm:'Livraison notée ✓'):a==='route'?'Bonne route 🛵':'Le restaurant est prévenu')}catch(e){toast(errMsg(e))}BUSY=false;ARM='';render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id;
  if(a==='out'){lsSet(KEY,null);ACC=null;V=null;seen=null;render();return}
  if(a==='pon'){pushOn();return}
  if(a==='ptest'){rpc('resto_liv_push_test',{p_code:CODE,p_tel:ACC.tel,p_pin:ACC.pin}).then(()=>toast('Avis de test envoyé')).catch(x=>toast(errMsg(x)));return}
  if(a==='route'){act('route',id);return}
  if(a==='qr'){const M=payModes();PAYW[id]=M[0]||'wave';ARM='';render();return}
  if(a==='qrm'){PAYW[id]=el.dataset.m==='om'?'om':'wave';ARM='';render();return}
  if(a==='qrx'){delete PAYW[id];ARM='';render();return}
  if(a==='livre'||a==='retour'){if(ARM!==a+':'+id){ARM=a+':'+id;render();setTimeout(()=>{if(ARM===a+':'+id){ARM='';render()}},6000);return}act(a,id);return}});
document.addEventListener('submit',async e=>{e.preventDefault();if(e.target.id!=='fLog')return;
  const tel=tel9($('l_tel').value),pin=String($('l_pin').value).replace(/\D/g,''),say=t=>{$('l_err').textContent=t};
  if(tel.length<9)return say('Écrivez votre numéro (9 chiffres)');if(pin.length!==4)return say('Le code a 4 chiffres');
  const b=$('l_btn');b.disabled=true;b.innerHTML='<span class="spin"></span>';
  try{const v=await rpc('resto_liv',{p_code:CODE,p_tel:tel,p_pin:pin});if(!v||!v.ok)throw new Error(v&&v.erreur||'Numéro ou code incorrect');
    ACC={tel,pin};lsSet(KEY,ACC);lsSet('trliv-last-'+CODE,{tel});setV(v);render();poll();pushResync()}
  catch(err){b.disabled=false;b.textContent='Entrer';say(errMsg(err))}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ACC&&!BUSY)load(true)});
document.addEventListener('pointerdown',()=>{try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state!=='running')audio.resume()}catch(e){}},{once:true});
/* ---------- Démarrage ---------- */
if(CODE)homeIcon('');
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(DEMO){try{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';s.onload=()=>{if(V&&Object.keys(PAYW).length)render()};document.head.appendChild(s)}catch(e){}load(false)}
else if(ACC){V=lsGet(KEY+'-v',null);render();load(false).then(()=>{poll();pushResync()})}
else render();
</script>
<script>
/* Démo : les boutons Appeler / WhatsApp vers les numéros d'exemple n'ouvrent rien (le contact Seck Apps marche toujours) */
(function(){
  function on(){try{return !!(DEMO)}catch(e){return false}}
  function num(h){h=String(h||'');var m=h.match(/^(?:tel|sms):\s*([+\d\s.-]+)/i)||h.match(/wa\.me\/\+?(\d+)/i)||h.match(/[?&]phone=\+?(\d+)/i);return m?m[1].replace(/\D/g,''):null}
  function bad(h){var n=num(h);return !!n&&!/^(221)?778790006$/.test(n)}
  function msg(h){var tel=/^(tel|sms):/i.test(String(h));var d=document.getElementById('demoMsg');if(!d){d=document.createElement('div');d.id='demoMsg';
      d.style.cssText='position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9999;max-width:88vw;background:#13222C;color:#fff;padding:12px 16px;border-radius:14px;font:600 15px/1.35 system-ui,sans-serif;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)';document.body.appendChild(d)}
    d.textContent='Exemple : dans la vraie app, ce bouton '+(tel?'appelle le numéro.':'ouvre WhatsApp.');clearTimeout(d._t);d.style.display='block';d._t=setTimeout(function(){d.style.display='none'},2600)}
  document.addEventListener('click',function(e){if(!on())return;var a=e.target&&e.target.closest&&e.target.closest('a[href]');if(a&&bad(a.getAttribute('href'))){e.preventDefault();e.stopImmediatePropagation();msg(a.getAttribute('href'))}},true);
  var ac=HTMLAnchorElement.prototype.click;HTMLAnchorElement.prototype.click=function(){if(on()&&bad(this.getAttribute('href'))){msg(this.getAttribute('href'));return}return ac.apply(this,arguments)};
  var wo=window.open;window.open=function(u){if(on()&&bad(u)){msg(u);return null}return wo.apply(window,arguments)};
})();
</script>
