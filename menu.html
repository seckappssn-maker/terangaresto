/* ---------- Calculs ---------- */
const plat=id=>R.plats.find(p=>p.id===id);

const hasT=p=>Array.isArray(p.tailles)&&p.tailles.length>0;
const encK=x=>encodeURIComponent(x).replace(/'/g,'%27');
function cI(key){const i=key.indexOf('~'),p=plat(i<0?key:key.slice(0,i));if(!p)return null;
  if(i<0)return hasT(p)?null:{key,p,nom:p.nom,prix:p.prix,tl:''};const tl=(p.tailles||[]).find(x=>x.n===key.slice(i+1));return tl?{key,p,nom:p.nom+' ('+tl.n+')',prix:+tl.p||0,tl:tl.n}:null}

   <div class="muted">${t('Choisissez la taille')}</div>
   <div class="tgrid">${p.tailles.map(x=>{const k=p.id+'~'+x.n,q=cart[k]||0;return `<div class="tb ${q?'on':''}"><div><b>${esc(x.n)}</b><div class="price">${F(+x.p||0)}</div></div>
     ${q?`<div class="qty"><button onclick="decT(decodeURIComponent('${encK(k)}'))" aria-label="Moins">−</button><b>${q}</b><button onclick="incT(decodeURIComponent('${encK(k)}'))" aria-label="Plus">+</button></div>`:`<button class="add" onclick="incT(decodeURIComponent('${encK(k)}'))">+ ${t('Ajouter')}</button>`}</div>`}).join('')}</div>

function zones(){return Array.isArray(R.zones)?R.zones.filter(z=>z&&z.nom):[]}

  if(st==='demo')return `<div class="stbox" style="--sc:#7B3FA0"><b>🌐 ${t('Envoyée au restaurant')}</b><div>${t('Exemple : sur une vraie page, la commande arrive directement dans la caisse du restaurant.')}</div></div>`;
  if(st==='accepte')return `<div class="stbox" style="--sc:#2E7D4F"><b>✅ ${t('Commande confirmée !')}${LAST.n?' n°'+LAST.n:''}</b><div>${t('Le restaurant prépare votre commande.')}</div></div>`;
  if(st==='refuse')return `<div class="stbox" style="--sc:#C62828"><b>❌ ${t('Le restaurant ne peut pas prendre la commande pour le moment.')}</b><div>${t('Écrivez-lui sur WhatsApp pour en savoir plus.')}</div></div>`;
  if(st==='nouveau'||st==='envoi')return `<div class="stbox" style="--sc:#E07B0E"><b>⏳ ${t('Envoyée au restaurant')}</b><div>${t('En attente de confirmation… Cette page se met à jour toute seule.')}</div></div>`;
  return `<b>${t('Commande envoyée ? Le restaurant va vous confirmer sur WhatsApp.')}</b>`}

boot();
if(LAST&&LAST.id&&(LAST.st==='nouveau'||LAST.st==='envoi'))suivre();
