<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de caisse mobile — en-tête fin, contenu en cartes, barre d'onglets fixe en bas, gros boutons lisibles */
:root{
  --bg:#F4F7F9; --surface:#FFFFFF; --ink:#13222C; --muted:#5D6F7B; --line:#DCE5EB;
  --bissap:#155E83; --bissap-soft:#E2EFF6; --ochre:#1E95CC; --ochre-soft:#E0F3FC;
  --ok:#2E7D4F; --ok-soft:#E1F2E7; --warn:#B4610F; --warn-soft:#FCEBD8; --bad:#B3261E; --bad-soft:#FBE3E1;
  --on-accent:#FFFFFF;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171C; --surface:#172229; --ink:#E8F1F6; --muted:#9AB0BD; --line:#26353F;
  --bissap:#5DB3DE; --bissap-soft:#16303D; --ochre:#7FD0F5; --ochre-soft:#123444;
  --ok:#6BCB8E; --ok-soft:#1C3325; --warn:#F0A55A; --warn-soft:#3A2814; --bad:#F2837A; --bad-soft:#3D1B19;
  --on-accent:#0F171C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171C; --surface:#172229; --ink:#E8F1F6; --muted:#9AB0BD; --line:#26353F;
  --bissap:#5DB3DE; --bissap-soft:#16303D; --ochre:#7FD0F5; --ochre-soft:#123444;
  --ok:#6BCB8E; --ok-soft:#1C3325; --warn:#F0A55A; --warn-soft:#3A2814; --bad:#F2837A; --bad-soft:#3D1B19;
  --on-accent:#0F171C; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
.top .nm{flex:1;min-width:0}
.top h1{font-size:21px;font-weight:800;color:var(--bissap);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{color:var(--muted);font-size:13px;white-space:nowrap}
.sync{font-weight:700}.sync.ok{color:var(--ok)}.sync.err{color:var(--bad)}.sync.wait{color:var(--muted)}
.acc{max-width:420px}.acc-f{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.who{background:var(--bissap);color:var(--on-accent);font-weight:800;font-size:14px;border-radius:999px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.lang{border:1.5px solid var(--bissap);background:transparent;color:var(--bissap);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}
main{max-width:1200px;margin:0 auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.big{font-family:var(--f-display);font-size:30px;font-weight:800}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;cursor:pointer;background:var(--bissap);color:var(--on-accent);min-height:48px}
.btn.alt{background:var(--bissap-soft);color:var(--bissap)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.ok{background:var(--ok);color:var(--on-accent)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btn:focus-visible,.chip:focus-visible,.tile:focus-visible,.lang:focus-visible,.nav button:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.card>*{flex-shrink:0}
.chips{flex-shrink:0}
.typebar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex-shrink:0}
.typebar .chip{min-height:52px;font-size:16px;padding:8px 6px;border-radius:14px;text-align:center;color:var(--ink);white-space:normal;line-height:1.15}
.typebar .chip.on{color:var(--bg)}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:15px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.plat{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:84px}
.plat b{font-size:18px;line-height:1.2}
.plat .ph{width:100%;aspect-ratio:4/3;border-radius:9px;object-fit:cover;margin-bottom:6px;display:grid;place-items:center;background:var(--bissap-soft);color:var(--bissap);font-family:var(--f-display);font-weight:800;font-size:30px}
.plat:active{transform:scale(.97)}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:var(--bissap-soft)}
.phedit{display:flex;gap:12px;align-items:center}
.phlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.phitem{position:relative;display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:6px;background:var(--surface)}
.phitem img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block;max-width:100%}
.phitem.phadd{align-items:center;justify-content:center;min-height:120px;border-style:dashed;cursor:pointer;color:var(--bissap);font-weight:800;text-align:center}
.phbtns{display:flex;gap:6px;flex-wrap:wrap}.phbtns .btn{flex:1;min-height:36px;padding:6px 8px}
.phwarn{font-size:12px;color:var(--warn);font-weight:700}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}.chk input{width:22px;height:22px;flex:none}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:800;width:100%;text-align:left}
.switch.on{border-color:var(--ok);background:var(--ok-soft)}
.switch .knob{width:56px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none}
.switch .knob::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch.on .knob{background:var(--ok)}.switch.on .knob::after{left:28px}
.linkbox{font-family:ui-monospace,Menlo,monospace;font-size:14px;word-break:break-all;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;user-select:all}
.zrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:8px;align-items:end}
.phedit img,.phedit .ph{width:96px;height:72px;border-radius:10px;object-fit:cover;background:var(--bissap-soft);display:grid;place-items:center;color:var(--bissap);font-weight:800;font-size:26px;flex:none}
.plat span{color:var(--muted);font-weight:700;font-size:16px}
.plat.jour{border-color:var(--ochre);background:var(--ochre-soft)}
.plat.off{opacity:.45}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.cat{border:0;border-bottom:5px solid var(--cc);border-radius:12px;min-height:50px;padding:6px 8px;font-weight:800;font-size:15px;cursor:pointer;background:var(--bissap-soft);color:var(--ink);line-height:1.15;box-shadow:inset 0 0 0 2px transparent}
.cat.on{background:var(--cc,var(--ink));color:#fff;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
.btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bt{position:relative;border:0;border-radius:14px;min-height:84px;padding:10px 6px;background:var(--cc,#155E83);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;font-weight:800;line-height:1.15;-webkit-tap-highlight-color:transparent}
.bt b{font-size:14px;text-transform:uppercase;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bt span{font-size:14px;font-weight:700;opacity:.92}
.bt:active{transform:scale(.97);filter:brightness(1.1)}
.bt.off{opacity:.35}
.bt.jour::before{content:"★";position:absolute;top:5px;left:8px;font-size:14px}
.bt .q{position:absolute;top:5px;right:6px;background:#fff;color:#13222C;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-weight:800;font-size:14px;padding:0 6px}
.vtog{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.bt{padding-top:22px}.bt .q{top:3px;right:4px;min-width:22px;height:22px;font-size:13px}
@media (min-width:700px){.bt{padding-top:10px}.bt .q{top:5px;right:6px;min-width:26px;height:26px;font-size:14px}.btns{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.bt{min-height:92px}.bt b{font-size:16px}}
.plat .q{position:absolute;top:-8px;right:-6px;background:var(--bissap);color:var(--on-accent);border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:800;font-size:15px;padding:0 6px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.t-jour{background:var(--ochre);color:var(--on-accent)}
.t-cuisine{background:var(--warn-soft);color:var(--warn)}
.t-prete{background:var(--ochre-soft);color:var(--ochre)}
.t-servie{background:var(--ok-soft);color:var(--ok)}
.t-paye{background:var(--ok-soft);color:var(--ok)}
.t-du{background:var(--bad-soft);color:var(--bad)}
.t-neutre{background:var(--bissap-soft);color:var(--bissap)}
.line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .g{flex:1;min-width:0}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px;flex:1;min-width:130px}
input,select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--surface);width:100%;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--bissap);border-color:transparent}
.total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-weight:800;font-size:26px}
.order{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.order{border-left:8px solid var(--oc,var(--line))}
.order.s-cuisine{--oc:#E07B0E;background:color-mix(in srgb,#E07B0E 9%,var(--surface))}
.order.s-prete{--oc:#1E7FD8;background:color-mix(in srgb,#1E7FD8 9%,var(--surface))}
.order.s-apayer{--oc:#C62828;background:color-mix(in srgb,#C62828 8%,var(--surface))}
.order.s-fini{--oc:#2E7D4F;background:color-mix(in srgb,#2E7D4F 7%,var(--surface));opacity:.78}
.ostat{display:inline-flex;align-items:center;gap:6px;background:var(--oc);color:#fff;font-weight:800;font-size:15px;border-radius:10px;padding:5px 12px}
.order.new{box-shadow:0 0 0 3px var(--oc);animation:onew 1.2s ease-in-out 3}
@keyframes onew{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--oc) 35%,transparent)}}
.olist{display:flex;flex-direction:column;gap:10px}
@media (min-width:900px){.olist{display:grid;grid-template-columns:1fr 1fr;align-items:start}}
.oleg{display:flex;flex-wrap:wrap;gap:8px}
.oleg button{border:0;border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px;color:#fff;background:var(--oc);cursor:pointer;opacity:.9}
.oleg button.dim{opacity:.35}
.pretbox{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:60;width:min(560px,calc(100% - 24px));display:flex;flex-direction:column;gap:8px}
.pret{background:#1E7FD8;color:#fff;border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 12px 34px rgba(0,0,0,.3);animation:pin .35s ease-out}
.pret .big{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.15}
.pret .sm{font-size:15px;opacity:.95;font-weight:600}
.pret button{margin-left:auto;border:0;background:#fff;color:#1E7FD8;font-weight:800;font-size:17px;border-radius:12px;padding:12px 18px;cursor:pointer;flex:none}
@keyframes pin{from{transform:translateY(-30px);opacity:0}}
.order .num{font-family:var(--f-display);font-weight:800;font-size:20px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800}
.stat .pos{color:var(--ok)} .stat .neg{color:var(--bad)}
.bar{height:10px;border-radius:5px;background:var(--bissap-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--bissap);border-radius:5px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:92px}
.tile b{font-family:var(--f-display);font-size:18px}
.tile span{color:var(--muted);font-size:14px}
.banner{background:var(--ochre-soft);border:1px solid var(--ochre);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);padding:6px 0;cursor:pointer;border-radius:10px}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--bissap);background:var(--bissap-soft)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(8,18,24,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet>*{flex-shrink:0}
.sheet h2{font-size:22px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 8px;font-weight:800;cursor:pointer;font-size:16px}
.mode.on{border-color:var(--bissap);background:var(--bissap-soft);color:var(--bissap)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:30}
.empty{text-align:center;color:var(--muted);padding:20px 8px}

.paybar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn.pay{min-height:62px;font-size:18px;padding:10px 6px}
.toast{display:flex;align-items:center;gap:12px}
.tbtn{border:0;background:var(--bissap);color:var(--on-accent);font-weight:800;border-radius:999px;padding:6px 14px;cursor:pointer}
.caisse{display:flex;flex-direction:column;gap:14px}
.zone{display:flex;flex-direction:column;gap:8px}
.zone+.zone{border-top:1px solid var(--line);padding-top:12px}
.cleft{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:700px){
  .plats{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .plat{padding:14px}
  .plat b{font-size:19px}
  body{font-size:17px}
}
@media (min-width:900px){
  .caisse{display:grid;grid-template-columns:minmax(0,1fr) 380px;align-items:start}
  .cright{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 180px);overflow:auto}
  .nav{max-width:1200px;margin:0 auto;border-radius:16px 16px 0 0}
}
body.nonav{padding-bottom:24px}
.lock{align-items:center;text-align:center;padding-block:24px;max-width:380px;margin:12px auto;width:100%}
.lock h2{font-size:24px;color:var(--bissap)}
.dots{display:flex;gap:14px;margin:6px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--bissap)}
.dots i.on{background:var(--bissap)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.pad button{height:64px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);font-size:26px;font-weight:700;cursor:pointer;font-family:var(--f-display)}
.pad button:active{background:var(--bissap-soft)}
.k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.k-card{border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px}
.k-card.cuisine{border-color:var(--warn)}
.k-card.prete{border-color:var(--ochre);opacity:.8}
.k-card .it{font-size:20px;font-weight:700;line-height:1.25}
.k-card .num{font-family:var(--f-display);font-weight:800;font-size:26px}
.k-card .age{font-weight:700}
.k-card .age.late{color:var(--bad)}
#print{display:none}
@media print{
  @page{size:58mm auto;margin:2mm}
  body{padding:0;background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block;width:54mm;font:11px/1.35 "Courier New",monospace;color:#000}
  #print .c{text-align:center} #print .r{display:flex;justify-content:space-between;gap:4px}
  #print hr{border:0;border-top:1px dashed #000;margin:4px 0}
  #print .xl{font-size:15px;font-weight:700}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>


<header class="top">
  <div class="nm"><h1 id="hName">Teranga Resto</h1><div class="row" style="gap:6px;flex-wrap:nowrap"><span id="who" class="who" hidden></span><small id="hDate"></small><small id="syncDot" class="sync" hidden></small></div></div>

/* ---------- Calculs ---------- */
const sousTot=o=>o.items.reduce((a,i)=>a+i.prix*i.q,0)+(+o.frais||0);
const tot=o=>Math.max(0,sousTot(o)-(+o.remise||0));
const sum=(a,f=x=>x.montant)=>a.reduce((s,x)=>s+(+f(x)||0),0);
function range(p){const d=new Date();d.setHours(0,0,0,0);if(p==='sem'){d.setDate(d.getDate()-((d.getDay()+6)%7))}if(p==='mois'){d.setDate(1)}return d.getTime()}
const inR=(iso,from)=>new Date(iso).getTime()>=from;
function entrees(from){
  const L=[];
  S.orders.forEach(o=>{if(o.annule)return;
    if(o.paiements)o.paiements.forEach(p=>{if(inR(p.date,from))L.push({montant:p.montant,mode:p.mode,src:'Commande n°'+o.n})});
    if(!o.paye||o.mode==='partage'||!inR(o.payeLe||o.date,from))return;
    if(o.mode==='especes'||o.mode==='wave'||o.mode==='om')L.push({montant:tot(o),mode:o.mode,src:'Commande n°'+o.n});
    else if(o.mode==='mixte'&&o.parts)['especes','wave','om'].forEach(m=>{if(+o.parts[m])L.push({montant:+o.parts[m],mode:m,src:'Commande n°'+o.n})})});
  S.clients.forEach(c=>c.paiements.forEach(p=>{if(inR(p.date,from))L.push({montant:p.montant,mode:p.mode,src:'Dette '+c.nom})}));
  S.abonnes.forEach(a=>a.paiements.forEach(p=>{if(inR(p.date,from))L.push({montant:p.montant,mode:p.mode,src:'Abonnement '+a.nom})}));
  S.events.forEach(e=>e.paiements.forEach(p=>{if(inR(p.date,from))L.push({montant:p.montant,mode:p.mode,src:e.type+' '+e.client})}));
  return L;
}
function detteClient(c){return sum(S.orders.filter(o=>!o.annule&&o.mode==='credit'&&o.clientId===c.id),tot)-sum(c.paiements)}

function platImg(p){return (Array.isArray(p.photos)&&p.photos[0])||p.photo||''}

function rapideZones(){
  const wd=new Date().getDay(),from=Date.now()-30*864e5,cnt={};
  S.orders.forEach(o=>{if(!o.annule&&new Date(o.date).getTime()>=from)o.items.forEach(i=>cnt[i.pid]=(cnt[i.pid]||0)+i.q)});
  const jour=S.plats.filter(p=>p.dispo&&p.jours&&p.jours.includes(wd));
  const Z=[];if(jour.length)Z.push([t('Plat du jour'),jour]);
  const MAX={'Plats':8,'Boissons':8};
  CATS.forEach(c=>{const L=S.plats.filter(p=>p.dispo&&p.cat===c&&!jour.includes(p)).sort((a,b)=>(cnt[b.id]||0)-(cnt[a.id]||0)).slice(0,MAX[c]||6);if(L.length)Z.push([t(c),L])});
  return Z;
}
function rapides(){
  const wd=new Date().getDay(),from=Date.now()-30*864e5,cnt={};
  S.orders.forEach(o=>{if(!o.annule&&new Date(o.date).getTime()>=from)o.items.forEach(i=>cnt[i.pid]=(cnt[i.pid]||0)+i.q)});
  const jour=S.plats.filter(p=>p.jours&&p.jours.includes(wd));
  const top=S.plats.filter(p=>!jour.includes(p)).sort((a,b)=>(cnt[b.id]||0)-(cnt[a.id]||0)||(a.cat==='Plats'?-1:0));
  return [...jour,...top].filter(p=>p.dispo).slice(0,caisseVue==='boutons'?16:12);
}

}
function updTot(){const lines=Object.entries(cart.items).filter(([,q])=>q>0);let s=0;lines.forEach(([id,q])=>{const p=S.plats.find(x=>x.id===id);if(p)s+=p.prix*q});if(cart.type==='livraison'&&!cart.addTo)s+=+cart.frais||0;const e=document.getElementById('cartTot');if(e)e.textContent=F(s)}
function addP(id){cart.items[id]=(cart.items[id]||0)+1;render()}
function decP(id){cart.items[id]=Math.max(0,(cart.items[id]||0)-1);if(!cart.items[id])delete cart.items[id];render()}
function valider(payer){
  const items=Object.entries(cart.items).filter(([,q])=>q>0).map(([id,q])=>{const p=S.plats.find(x=>x.id===id);return{pid:id,nom:p.nom,prix:p.prix,q}});
  if(!items.length){toast('Ajoutez au moins un plat');return}
  if(cart.addTo){const o=S.orders.find(x=>x.id===cart.addTo);
    if(!o||o.paye||o.annule){toast('Cette commande est déjà payée');cart=newCart();render();return}
    items.forEach(it=>{const ex=o.items.find(i=>i.pid===it.pid&&i.prix===it.prix);if(ex)ex.q+=it.q;else o.items.push({...it})});
    o.cuisineItems=items;o.ajout=(o.ajout||0)+1;o.cuisineDate=new Date().toISOString();
    if(cart.note)o.cuisineNote=cart.note;else delete o.cuisineNote;
    o.statut='cuisine';save();cart=newCart();toast(t('Ajout')+' n°'+o.n+' → '+t('Cuisine'));go('commandes');return}
  if(cart.type==='livraison'&&String(cart.tel||'').replace(/\D/g,'').length<7){toast('Livraison : écrivez le téléphone du client');return}
  if(cart.type!=='livraison'){cart.tel='';cart.quartier=''}
  const n=Math.max(0,...todayOrders().map(o=>o.n))+1;
  const o={id:uid(),n,date:new Date().toISOString(),type:cart.type,table:cart.table,client:{nom:cart.nom,tel:cart.tel,quartier:cart.quartier},frais:cart.type==='livraison'?+cart.frais||0:0,items,note:cart.note,statut:'cuisine',paye:false,par:me.nom,parId:me.id||'patron'};
  if(cart.type==='livraison')applyLiv(o,cart.livSel,cart.livreur,cart.livTel);
  S.orders.push(o);save();cart=newCart();
  if(payer==='especes'){render();cashModal(o.id)}
  else if(payer==='wave'||payer==='om'){finishPay(o,payer)}
  else if(payer){render();payModal(o.id)}
  else{toast('Commande n°'+n+' envoyée en cuisine');render()}
}
function finishPay(o,mode,recu){
  o.paye=true;o.mode=mode;o.payeLe=new Date().toISOString();o.encPar=me.nom;if(recu)o.recu=recu;save();closeM();render();
  toastAct(`n°${o.n} ${t('Payée')} · ${mName(mode)}`,t('Ticket'),()=>ticketOrder(o.id));
}

function cashModal(id){cashId=id;cashRecu=0;drawCash()}
function drawCash(){const o=S.orders.find(x=>x.id===cashId),T=tot(o);

   <div class="modes">${billets.map(v=>`<button class="mode ${cashRecu===v?'on':''}" onclick="cashRecu=${v};drawCash()">${v===T?t('Compte juste'):F(v)}</button>`).join('')}</div>
   <label class="f">${t('Autre montant')}<input id="cash_o" inputmode="numeric" placeholder="Ex : 3000" oninput="cashRecu=+this.value||0;document.getElementById('cashR').textContent=F(Math.max(0,cashRecu-${T}))"></label>
   <div class="total" style="font-size:24px;color:var(--ok)"><span>${t('Monnaie à rendre')}</span><span id="cashR">${F(Math.max(0,cashRecu-T))}</span></div>

function applyLiv(o,sel,nom,tel){
  delete o.livreurId;o.livreur='';o.livreurTel='';o.livExterne=false;
  if(sel&&sel.startsWith('s:')){const s=S.staff.find(x=>x.id===sel.slice(2));if(s){o.livreurId=s.id;o.livreur=s.nom;o.livreurTel=s.tel||''}}
  else if(sel&&sel.startsWith('e:')){const l=S.livExt[+sel.slice(2)];if(l){o.livreur=l.nom;o.livreurTel=l.tel;o.livExterne=true}}
  else if(sel==='new'&&(nom||'').trim()){o.livreur=nom.trim();o.livreurTel=tel||'';o.livExterne=true;
    if(!S.livExt.some(l=>l.nom===o.livreur&&l.tel===o.livreurTel))S.livExt.push({nom:o.livreur,tel:o.livreurTel})}
}
function livTxt(o){const T=tot(o);return `*${S.set.nom}* – Livraison n°${o.n}\nClient : ${o.client.nom||'-'}\nTél client : ${o.client.tel||'-'}\nAdresse : ${o.client.quartier||'-'}\n\n${o.items.map(i=>`${i.q} x ${i.nom}`).join('\n')}${o.note?`\nNote : ${o.note}`:''}\n\n${o.paye&&o.mode!=='credit'?`✅ Déjà payé (${MODES[o.mode]}) – ne rien encaisser`:`💰 À encaisser : *${F(T)}*`}\nLivraison incluse : ${F(o.frais)}\n\nMerci d'appeler le restaurant au ${S.set.tel} après la livraison.`}
function waLivreur(id){const o=S.orders.find(x=>x.id===id);if(!o.livreurTel){toast('Pas de numéro pour ce livreur');return}openWA(o.livreurTel,livTxt(o))}
let livSel2='',livN2='',livT2='';
function livModal(id){const o=S.orders.find(x=>x.id===id);livSel2=o.livreurId?'s:'+o.livreurId:'';livN2='';livT2='';drawLiv(id)}

/* ---------- Paiement ---------- */
let pay={};
function payModal(id){
  const o=S.orders.find(x=>x.id===id);pay={id,mode:o.paiements&&o.paiements.length?'partage':'mixte',n:2,pm:'',pmode:'especes',byItems:false,recu:'',clientId:'',newNom:o.client.nom||'',newTel:o.client.tel||'',abId:'',pe:'',pw:'',po:''};
  drawPay();
}
function drawPay(){
  const o=S.orders.find(x=>x.id===pay.id),T=tot(o);
  const rendu=(+pay.recu||0)-T;
  modal(`<h2>${t('Encaisser')} · n°${o.n}</h2>
   <div class="total"><span>${t('Total')}</span><span>${F(T)}</span></div>
   <div class="lbl">${t('Mode de paiement')}</div>
   <div class="modes">${Object.entries(MODES).map(([k,l])=>`<button class="mode ${pay.mode===k?'on':''}" onclick="pay.mode='${k}';drawPay()">${t(l)}</button>`).join('')}</div>
   ${pay.mode==='especes'?`<label class="f">${t('Reçu')} (F)<input id="p_recu" inputmode="numeric" value="${esc(pay.recu)}" oninput="pay.recu=this.value;document.getElementById('rendu').textContent=F(Math.max(0,(+this.value||0)-${T}))"></label>
      <div class="row" style="flex-wrap:wrap">${[1000,2000,5000,10000].filter(v=>v>=T).slice(0,3).map(v=>`<button class="chip" onclick="pay.recu=${v};drawPay()">${F(v)}</button>`).join('')}</div>

   ${pay.mode==='mixte'?`<div class="muted">${t('Écrivez combien le client paie avec chaque moyen.')}</div>
      <div class="row"><label class="f">${t('Espèces')}<input id="px_e" inputmode="numeric" value="${esc(pay.pe)}" oninput="pay.pe=this.value;updMix(${T})"></label>
      <label class="f">Wave<input id="px_w" inputmode="numeric" value="${esc(pay.pw)}" oninput="pay.pw=this.value;updMix(${T})"></label>
      <label class="f">Orange Money<input id="px_o" inputmode="numeric" value="${esc(pay.po)}" oninput="pay.po=this.value;updMix(${T})"></label></div>
      <div class="total" style="font-size:20px"><span>${t('Reste')}</span><span id="mixR">${F(T)}</span></div>`:''}
   ${pay.mode==='wave'||pay.mode==='om'?`<div class="card"><div class="muted">Le client envoie ${F(T)} sur le numéro ${pay.mode==='wave'?'Wave':'Orange Money'} :</div><div class="big">${esc(pay.mode==='wave'?S.set.wave:S.set.om)}</div><div class="muted">Vérifiez le SMS de confirmation avant de valider.</div></div>`:''}
   ${pay.mode==='credit'?`<label class="f">${t('Client')}<select id="p_cl" onchange="pay.clientId=this.value;drawPay()"><option value="">+ Nouveau client</option>${S.clients.map(c=>`<option value="${c.id}" ${pay.clientId===c.id?'selected':''}>${esc(c.nom)} · ${t('Dette')} ${F(detteClient(c))}</option>`).join('')}</select></label>
      ${pay.clientId?'':`<div class="row"><label class="f">Nom<input id="p_nn" value="${esc(pay.newNom)}" oninput="pay.newNom=this.value"></label><label class="f">${t('Téléphone')}<input id="p_nt" inputmode="tel" value="${esc(pay.newTel)}" oninput="pay.newTel=this.value"></label></div>`}`:''}
   ${pay.mode==='abonne'?(S.abonnes.length?`<label class="f">Abonné<select id="p_ab" onchange="pay.abId=this.value"><option value="">Choisir…</option>${S.abonnes.map(a=>`<option value="${a.id}">${esc(a.nom)} · ${restantAb(a)} repas restants</option>`).join('')}</select></label>`:'<div class="muted">Aucun abonné. Ajoutez-en dans Plus › Abonnés.</div>'):''}
   ${pay.mode==='partage'?`<button class="btn ghost full" onclick="closeM();render()">${t('Plus tard')}</button>`:`<div class="grid2"><button class="btn ghost" onclick="closeM();render()">${t('Plus tard')}</button><button class="btn ok" onclick="confirmPay()">${t('Valider')}</button></div>`}`);
  if(pay.mode==='mixte')updMix(T);
}
function partageUI(o,T){
  const P=o.paiements||[],paid=sum(P),R=Math.max(0,T-paid),left=Math.max(1,(pay.n||2)-P.length);
  const share=left<=1?R:Math.min(R,Math.ceil(R/left/5)*5);
  if(pay.pm===''||pay.pm==null)pay.pm=String(share);
  return `<div class="lbl">${t('Nombre de personnes')}</div>
   <div class="chips" style="flex-wrap:wrap">${[2,3,4,5,6,8,10].map(n=>`<button class="chip ${pay.n===n?'on':''}" onclick="pay.n=${n};pay.pm='';drawPay()">${n}</button>`).join('')}</div>
   ${P.length?`<div class="card">${P.map((p,i)=>`<div class="row between"><span>${t('Personne')} ${i+1} · ${mName(p.mode)}</span><b>${F(p.montant)}</b></div>`).join('')}</div>`:''}
   <div class="total" style="font-size:22px"><span>${t('Reste')}</span><span>${F(R)}</span></div>
   <div class="card" style="gap:8px">
    <div class="row between"><b>${t('Personne')} ${P.length+1}</b><span class="muted">${left>1?t('Part égale')+' : '+F(share):t('Dernière personne')}</span></div>
    <label class="f">${t('Il paie')} (F)<input id="pp_m" inputmode="numeric" value="${esc(pay.pm)}" oninput="pay.pm=this.value"></label>
    <div class="muted" style="font-size:14px">${t('Ou touchez ce qu\'il a mangé')} :</div>
    <div class="chips" style="flex-wrap:wrap">${o.items.map(i=>`<button class="chip" onclick="pay.pm=String((pay.byItems?(+pay.pm||0):0)+${i.prix});pay.byItems=true;drawPay()">${esc(i.nom)} ${F(i.prix)}</button>`).join('')}
     <button class="chip" onclick="pay.pm='${share}';pay.byItems=false;drawPay()">${t('Part égale')}</button></div>
    <div class="modes" style="grid-template-columns:repeat(3,1fr)">${['especes','wave','om'].map(m=>`<button class="mode ${pay.pmode===m?'on':''}" onclick="pay.pm=val('pp_m');pay.pmode='${m}';drawPay()">${m==='om'?'OM':mName(m)}</button>`).join('')}</div>
    <button class="btn ok full" style="min-height:56px" onclick="partPay()">${t('Encaisser cette part')}</button>
   </div>`;
}
function partPay(){
  const o=S.orders.find(x=>x.id===pay.id),T=tot(o);o.paiements=o.paiements||[];
  const R=T-sum(o.paiements),a=Math.round(+val('pp_m')||0);
  if(a<=0)return toast(t('Il paie')+' ?');
  if(a>R)return toast(t('Reste')+' '+F(R));
  o.paiements.push({date:new Date().toISOString(),montant:a,mode:pay.pmode||'especes',par:me.nom});
  pay.pm='';pay.byItems=false;
  if(sum(o.paiements)>=T){o.paye=true;o.mode='partage';o.payeLe=new Date().toISOString();o.encPar=me.nom;save();closeM();render();
    toastAct(`n°${o.n} ${t('Payée')} · ${o.paiements.length} ${t('personnes')}`,t('Ticket'),()=>ticketOrder(o.id));return}
  save();toast(t('Part encaissée')+' · '+t('Reste')+' '+F(T-sum(o.paiements)));drawPay();
}
function updMix(T){const r=T-(+pay.pe||0)-(+pay.pw||0)-(+pay.po||0);const e=document.getElementById('mixR');if(e){e.textContent=r<0?'+'+F(-r)+' ('+t('Monnaie à rendre')+')':F(r);e.style.color=r===0?'var(--ok)':r<0?'var(--warn)':'var(--bad)'}}
function confirmPay(){
  const o=S.orders.find(x=>x.id===pay.id);
  if(pay.mode==='credit'){
    let c=S.clients.find(x=>x.id===pay.clientId);
    if(!c){if(!pay.newNom.trim()){toast('Écrivez le nom du client');return}c={id:uid(),nom:pay.newNom.trim(),tel:pay.newTel,quartier:'',paiements:[]};S.clients.push(c)}
    o.clientId=c.id;o.client.nom=o.client.nom||c.nom;
  }
  if(pay.mode==='abonne'){const a=S.abonnes.find(x=>x.id===pay.abId);if(!a){toast('Choisissez l\'abonné');return}a.pris.push(dk(new Date()));o.abId=a.id;o.client.nom=o.client.nom||a.nom}
  if(pay.mode==='especes')o.recu=+pay.recu||0;
  if(pay.mode==='mixte'){const T=tot(o),e=+pay.pe||0,w=+pay.pw||0,om=+pay.po||0;
    if(w+om>T)return toast('Wave + OM dépasse le total');
    if(e+w+om<T)return toast(t('Reste')+' '+F(T-e-w-om));
    o.parts={especes:T-w-om,wave:w,om};if(e>T-w-om)o.recu=e;}
  o.paye=true;o.mode=pay.mode;o.payeLe=new Date().toISOString();o.encPar=me.nom;save();closeM();
  toastAct(`n°${o.n} · ${mName(pay.mode)}`,t('Ticket'),()=>ticketOrder(o.id));
}

function shrink(file,W,H,q){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('img'));im.onload=()=>{
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);
  const sc=Math.max(W/im.width,H/im.height),w=im.width*sc,h=im.height*sc;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);
  if(c.toBlob)c.toBlob(b=>b?res({blob:b,url:c.toDataURL('image/jpeg',q)}):rej(new Error('blob')),'image/jpeg',q);else res({blob:null,url:c.toDataURL('image/jpeg',q)})};im.src=r.result};r.readAsDataURL(file)})}
async function pickPhoto(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;if(tmpPhotos.length+phBusy>=4)return toast('4 photos maximum');
  phBusy++;phRefresh();
  try{
    if(DEMO||!SB||!USER){const r=await shrink(f,480,360,0.66);tmpPhotos.push(r.url);tmpNew.push(r.url)}
    else{const r=await shrink(f,640,480,0.72);if(!r.blob)throw new Error('blob');
      const path=USER.id+'/'+uid()+'.jpg';const up=await SB.storage.from(PH_BUCKET).upload(path,r.blob,{contentType:'image/jpeg',cacheControl:'31536000',upsert:false});
      if(up.error)throw up.error;const url=SB.storage.from(PH_BUCKET).getPublicUrl(path).data.publicUrl;tmpPhotos.push(url);tmpNew.push(url)}
  }catch(e){const m=String(e&&e.message||e);toast(/img|blob/.test(m)?'Photo illisible, essayez une autre':/fetch|network|Failed/i.test(m)?'Pas de connexion : la photo n\'est pas envoyée':/row-level|policy|Unauthorized|403/i.test(m)?'Photo refusée : abonnement terminé ?':/bucket|not found/i.test(m)?'Photos pas encore activées (étape Supabase)':'Photo non envoyée : '+m)}
  phBusy--;phRefresh()}
function storageRemove(urls){if(DEMO||!SB||!USER)return;const mark='/object/public/'+PH_BUCKET+'/';

  if(paths.length)SB.storage.from(PH_BUCKET).remove(paths).catch(()=>{})}

function depModal(){modal(`<h2>Nouvelle dépense</h2>

function zCaisse(){const from=range('jour'),E=entrees(from),D=S.depenses.filter(d=>inR(d.date,from)),ord=S.orders.filter(o=>!o.annule&&inR(o.date,from));

function vPlus(){

  const dettes=sum(S.clients,detteClient), bas=S.stock.filter(s=>s.qte<=s.alerte).length, evs=S.events.filter(e=>e.date>=dk(new Date())).length;

   ${has('staff')?T('staff','Personnel',S.staff.length+' personnes · salaires, avances'):''}
   ${has('stock')?T('stock','Stock',bas?bas+' produit(s) bientôt fini(s)':'Riz, huile, gaz…'):''}

function abModal(){modal(`<h2>Nouvel abonné</h2><label class="f">Nom<input id="a_n"></label><div class="row"><label class="f">${t('Téléphone')}<input id="a_t" inputmode="tel"></label><label class="f">Lieu de travail<input id="a_l" placeholder="Bureau, chantier…"></label></div>
  <div class="row"><label class="f">Formule<select id="a_f"><option>Déjeuner</option><option>Petit-déj + déjeuner</option><option>Déjeuner + dîner</option><option>Les 3 repas</option></select></label><label class="f">Prix du mois (F)<input id="a_p" inputmode="numeric" value="30000"></label><label class="f">Repas prévus<input id="a_r" inputmode="numeric" value="26"></label></div>
  <button class="btn full" onclick="if(!val('a_n').trim())return toast('Écrivez le nom');S.abonnes.push({id:uid(),nom:val('a_n').trim(),tel:val('a_t'),lieu:val('a_l'),formule:val('a_f'),prix:+val('a_p')||0,prevus:+val('a_r')||0,mois:mk(new Date()),pris:[],paiements:[]});save();closeM();render()">${t('Enregistrer')}</button><button class="btn ghost full" onclick="closeM()">${t('Annuler')}</button>`)}
function repasAb(id){const a=S.abonnes.find(x=>x.id===id);if(!restantAb(a)){toast('Plus de repas ce mois');return}a.pris.push(dk(new Date()));save();render();toast('Repas noté pour '+a.nom)}
function payAb(id){const a=S.abonnes.find(x=>x.id===id),reste=a.prix-sum(a.paiements.filter(p=>mk(p.date)===a.mois));modal(`<h2>Paiement · ${esc(a.nom)}</h2><label class="f">Montant (F)<input id="pa_m" inputmode="numeric" value="${reste}"></label>${modeSel('pa_mode')}
  <button class="btn ok full" onclick="const m=+val('pa_m');if(!m)return toast('Montant ?');S.abonnes.find(x=>x.id==='${id}').paiements.push({date:new Date().toISOString(),montant:m,mode:val('pa_mode')});save();closeM();render();toast('Paiement noté')">${t('Enregistrer')}</button><button class="btn ghost full" onclick="closeM()">${t('Annuler')}</button>`)}
function renouv(id){const a=S.abonnes.find(x=>x.id===id);a.mois=mk(new Date());a.pris=a.pris.filter(d=>d.slice(0,7)===a.mois);save();render();toast('Mois en cours : '+a.mois)}

  <div class="row"><label class="f">Type<select id="e_ty">${EV_TYPES.map(x=>`<option>${x}</option>`).join('')}</select></label><label class="f">Date<input id="e_d" type="date" value="${dk(new Date())}"></label></div>

function saveEv(){if(!val('e_c').trim()||!+val('e_px'))return toast('Client et prix obligatoires');const a=+val('e_a')||0;

function payEv(id){const e=S.events.find(x=>x.id===id);modal(`<h2>Paiement · ${esc(e.client)}</h2><label class="f">Montant (F)<input id="pe_m" inputmode="numeric" value="${e.prix-sum(e.paiements)}"></label>${modeSel('pe_mode')}

/* Personnel */
function vStaff(){const m=mk(new Date());
  return `<div class="row between">${back()}<button class="btn sm" onclick="staffModal()">+ Personne</button></div><h2>${t('Personnel')}</h2>

  <div class="muted" style="font-size:14px">Chaque avance ou salaire est aussi noté dans les dépenses.</div>`}
function staffModal(id){const s=id?S.staff.find(x=>x.id===id):{nom:'',role:'caissier',pin:'',tel:'',salaire:''};
  const roles=['caissier','serveur','cuisine','livreur'].filter(roleOk);
  modal(`<h2>${id?'Modifier':'Nouvelle personne'}</h2>
  <label class="f">Nom<input id="s_n" value="${esc(s.nom)}"></label>
  <div class="row"><label class="f">Accès<select id="s_r">${roles.map(r=>`<option value="${r}" ${s.role===r?'selected':''}>${ROLES[r]}</option>`).join('')}<option value="livreur" ${s.role==='livreur'?'selected':''}>Livreur (sans code, reçoit sur WhatsApp)</option><option value="autre" ${s.role==='autre'?'selected':''}>Sans accès (gardien, aide…)</option></select></label>
  <label class="f">Code (4 chiffres)<input id="s_p" inputmode="numeric" maxlength="4" value="${esc(s.pin)}"></label></div>
  <div class="row"><label class="f">${t('Téléphone')}<input id="s_t" inputmode="tel" value="${esc(s.tel||'')}"></label><label class="f">${t('Salaire')} mensuel (F)<input id="s_s" inputmode="numeric" value="${esc(s.salaire)}"></label></div>
  <div class="muted" style="font-size:14px">Rôles possibles avec la formule ${FORMULES[S.set.formule].nom} : ${roles.map(r=>ROLES[r]).join(', ')}.</div>
  <button class="btn full" onclick="saveStaff('${id||''}')">${t('Enregistrer')}</button>
  ${id?`<button class="btn ghost full" style="color:var(--bad)" onclick="delStaff('${id}')">${t('Supprimer')} (son code ne marchera plus)</button>`:''}
  <button class="btn ghost full" onclick="closeM()">${t('Annuler')}</button>`)}
function saveStaff(id){
  const nom=val('s_n').trim(),role=val('s_r'),pin=val('s_p').trim();
  if(!nom)return toast('Écrivez le nom');
  const noCode=role==='autre'||role==='livreur';
  if(!noCode){
    if(!/^\d{4}$/.test(pin))return toast('Le code doit avoir 4 chiffres');
    if(pin===S.set.pinPatron||S.staff.some(x=>x.pin===pin&&x.id!==id))return toast('Ce code est déjà pris, choisissez-en un autre');
  }
  const d={nom,role,pin:noCode?'':pin,tel:val('s_t'),salaire:+val('s_s')||0};
  if(id)Object.assign(S.staff.find(x=>x.id===id),d);else S.staff.push({id:uid(),...d,mvts:[]});
  save();closeM();render();toast('Enregistré')}
function delStaff(id){if(delConf!==id){delConf=id;toast('Touchez encore pour supprimer');return}S.staff=S.staff.filter(x=>x.id!==id);delConf=null;save();closeM();render()}

async function doAuth(){const ph=phoneDigits(val('au_tel')),pw=val('au_pw'),su=authMode==='signup',m=document.getElementById('au_msg'),say=x=>{if(m)m.textContent=x};
  if(ph.length<11)return say('Numéro de téléphone invalide');if(pw.length<6)return say('Le mot de passe doit avoir au moins 6 caractères');
  if(su&&pw!==val('au_pw2'))return say('Les deux mots de passe ne sont pas pareils');
  if(!SB)return say('Pas de connexion internet : réessayez');
  const nom=su?val('au_nom').trim():'';const b=document.getElementById('au_btn');if(b){b.disabled=true;b.textContent='Connexion…'}say('');
  try{const r=su?await SB.auth.signUp({email:ph+MAIL_DOM,password:pw}):await SB.auth.signInWithPassword({email:ph+MAIL_DOM,password:pw});
    if(r.error)throw r.error;if(!r.data.session)throw new Error('Compte créé mais pas encore actif. Contactez '+SUPPORT_NAME+'.');
    USER=r.data.session.user;
    const c=readCache();let base=null;if(c&&c.uid===USER.id){S=c.S;snap=c.snap||{};lastPull=c.lastPull||EPOCH;AB=c.AB||null}else base=freshStart();

    await sync(false);

  catch(e){const msg=String(e&&e.message||'');MODE='account';render();const m2=document.getElementById('au_msg');
    if(m2)m2.textContent=/already|registered|exists/i.test(msg)?'Ce numéro a déjà un compte : appuyez sur « Se connecter »':/invalid login|credentials/i.test(msg)?'Numéro ou mot de passe faux':/fetch|network|Failed/i.test(msg)?'Pas de connexion internet : réessayez':msg}}

async function checkAb(){await fetchAb();const a=abState();render();toast(a.st==='blocked'?'Paiement pas encore enregistré':'Abonnement actif jusqu\'au '+fdate(a.end))}
function abBanner(){const a=abState();if(DEMO||!AB||a.st==='ok'||!me||!(isP()||me.role==='caissier'))return'';
  return `<div class="banner" style="${a.st==='grace'?'border-color:var(--bad);background:var(--bad-soft)':''}"><div>${a.st==='grace'?`<b>Abonnement expiré le ${fdate(a.end)}.</b> L'app sera bloquée dans ${GRACE+a.left} jour(s).`:a.trial?`<b>Essai gratuit :</b> encore ${a.left} jour(s), jusqu'au ${fdate(a.end)}.`:`<b>Abonnement :</b> fin dans ${a.left} jour(s), le ${fdate(a.end)}.`} Payez ${F(abPrix())} par Wave ou Orange Money au ${esc(PAY_NUM)}.</div>${isP()?`<button class="btn sm" onclick="tab='plus';sub='reglages';render()">Voir mon abonnement</button>`:''}</div>`}

async function boot(){
  let mode='';try{mode=localStorage.getItem(MODE_KEY)||''}catch(e){}
  if(mode==='demo'){startDemo();return}
  MODE='boot';S=emptyS();render();
  const t0=Date.now();while(!window.supabase&&Date.now()-t0<7000)await new Promise(r=>setTimeout(r,150));
  const c=readCache();
  if(!window.supabase){if(c&&c.S){S=c.S;snap=c.snap||{};lastPull=c.lastPull||EPOCH;AB=c.AB||null;USER={id:c.uid,email:''};migrate();loadMe();MODE='app';render();toast('Pas de connexion : mode hors ligne')}else{MODE='account';render()}return}
  SB=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'terangaResto.auth'}});
  try{const{data}=await SB.auth.getSession();USER=data&&data.session?data.session.user:null}catch(e){USER=null}
  if(!USER){MODE='account';render();return}
  let base=null;if(c&&c.uid===USER.id){S=c.S;snap=c.snap||{};lastPull=c.lastPull||EPOCH;AB=c.AB||null}else base=freshStart();
  migrate();loadMe();MODE='app';render();
  await fetchAb();
  if(base!==null){try{await pull(true)}catch(e){setSyncSt('err',e)}if(snap['set|main']===base&&syncSt!=='err'){S={...freshResto('',USER.email.split('@')[0]),orders:S.orders};migrate();writeCache()}}
  await sync(false);
  render();
}
setInterval(()=>{if(document.visibilityState==='visible'&&MODE==='app'&&!DEMO)sync(false)},4000);
setInterval(()=>{if(MODE==='app'&&!DEMO)fetchAb().then(()=>{if(abState().st==='blocked')softRender()})},300000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&MODE==='app'&&!DEMO){sync(false);fetchAb()}});
window.addEventListener('online',()=>{if(MODE==='app'&&!DEMO)sync(false)});
document.addEventListener('focusout',()=>setTimeout(()=>{if(dirtyRender){const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))&&!document.getElementById('ovWrap').innerHTML){dirtyRender=false;render()}}},300));
cart=newCart();boot();
