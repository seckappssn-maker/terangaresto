<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Suivez votre commande : vous voyez quand elle est prête.">
<meta property="og:type" content="website">
<meta property="og:title" content="Ma commande – Teranga Resto">
<meta property="og:description" content="Suivez votre commande : vous voyez quand elle est prête.">
<meta property="og:image" content="https://seckappssn-maker.github.io/terangaresto/copertina.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#155E83">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Ma commande</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F4F7F9;--surface:#fff;--ink:#13222C;--muted:#5D6F7B;--line:#DCE5EB;--bissap:#155E83;--prep:#E07B0E;--prep-soft:#FCEBD8;--ok:#1F9D5B;--ok-soft:#DDF5E8;--bad:#B3261E;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;--f-body:'Figtree',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D161C;--surface:#15212A;--ink:#EAF1F5;--muted:#9FB0BB;--line:#26343F;--prep-soft:#3A2710;--ok-soft:#0F3322}}
:root[data-theme="dark"]{--bg:#0D161C;--surface:#15212A;--ink:#EAF1F5;--muted:#9FB0BB;--line:#26343F;--prep-soft:#3A2710;--ok-soft:#0F3322}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);min-height:100vh;padding:env(safe-area-inset-top,0) 16px calc(24px + env(safe-area-inset-bottom,0))}
main{max-width:460px;margin:0 auto}
header{padding:18px 2px 10px}
header h1{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0;line-height:1.1}
header small{display:block;color:var(--muted);font-weight:600;font-size:14px;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 18px;text-align:center;margin-bottom:14px}
.lbl{font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.num{font-family:var(--f-display);font-weight:800;font-size:min(34vw,150px);line-height:1;margin:4px 0 2px}
.sub{color:var(--muted);font-weight:600}
.etat{margin-top:16px;border-radius:16px;padding:16px 14px;font-weight:700;font-size:19px;line-height:1.3}
.etat.prep{background:var(--prep-soft);color:var(--prep)}
.etat.ok{background:var(--ok);color:#fff;font-size:24px}
.etat.fini{background:var(--line);color:var(--ink)}
.etat.bad{background:#FBE3E1;color:var(--bad)}
.etat small{display:block;font-weight:600;font-size:15px;opacity:.9;margin-top:4px}
.card.pret{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.card.pret .num{color:var(--ok)}
.flash{animation:fl 1s ease-in-out 4}
@keyframes fl{50%{transform:scale(1.04)}}
.steps{display:flex;justify-content:space-between;gap:6px;margin:18px 0 2px;text-align:center}
.step{flex:1;font-size:13px;font-weight:600;color:var(--muted)}
.step i{display:flex;align-items:center;justify-content:center;width:34px;height:34px;margin:0 auto 6px;border-radius:50%;background:var(--line);font-style:normal;font-size:16px}
.step.on{color:var(--ink)}.step.on i{background:var(--bissap);color:#fff}
.step.done i{background:var(--ok);color:#fff}
button.son{width:100%;border:0;border-radius:14px;min-height:54px;font:700 17px var(--f-body);background:var(--bissap);color:#fff;cursor:pointer;margin-bottom:14px}
.note{color:var(--muted);text-align:center;font-size:14px;line-height:1.45;padding:0 6px}
.demo{background:#7B3FA0;color:#fff;text-align:center;border-radius:12px;padding:8px 10px;font-weight:600;font-size:14px;margin-top:14px}
.dots::after{content:'…';animation:dt 1.2s steps(3) infinite}
</style>
</head>
<body>
<main>
  <header><h1 id="resto">Ma commande</h1><small>Suivi de votre commande</small></header>
  <div id="app"><div class="card"><div class="sub dots">Chargement</div></div></div>
</main>
<script>
const SUPA_URL='https://ncsjgmkrsvtwklfrdbgy.supabase.co';
const SUPA_KEY='sb_publishable_oDE4BbU6J3RTnce1Oo91cQ_hokWgh0U';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=new URLSearchParams(location.search);
const DEMO=q.get('demo')==='1';
let ID=q.get('i')||'',TK=q.get('k')||'';
/* Sans lien complet : on reprend la dernière commande suivie sur ce téléphone */
try{if(!DEMO&&(!ID||!TK)){const l=JSON.parse(localStorage.getItem('trs.last')||'null');if(l&&l.i&&l.k&&Date.now()-l.at<12*3600000){ID=l.i;TK=l.k}}
  else if(!DEMO)localStorage.setItem('trs.last',JSON.stringify({i:ID,k:TK,at:Date.now()}))}catch(e){}

let C=null,prev=null,t0=Date.now(),timer=null,audio=null,sonOk=false,wake=null;

/* ---------- Son : un « ding » et une voix quand la commande est prête ---------- */
function unlock(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state!=='running')audio.resume();
  const o=audio.createOscillator(),g=audio.createGain();g.gain.value=0.0001;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.05)}catch(e){}
  try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}
  sonOk=true;veille();draw()}
function ding(){try{if(!audio)return;[0,.35].forEach((d,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=i?1318:988;
  g.gain.setValueAtTime(.0001,audio.currentTime+d);g.gain.exponentialRampToValueAtTime(.5,audio.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d+.9);
  o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+d);o.stop(audio.currentTime+d+1)})}catch(e){}}
function parler(txt){try{const u=new SpeechSynthesisUtterance(txt);u.lang='fr-FR';u.rate=.95;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
async function veille(){try{if(navigator.wakeLock&&!wake&&document.visibilityState==='visible'){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}}catch(e){}}

/* ---------- Lecture de l'état de la commande ---------- */
async function lire(){
  if(DEMO){const s=(Date.now()-t0)/1000;C={ok:true,n:+q.get('n')||76,resto:q.get('r')||'Teranga Resto',type:'emporter',table:'',statut:s<20?'cuisine':'prete'};return}
  if(!ID||!TK){C={ok:false,raison:'lien'};return}
  try{const r=await fetch(SUPA_URL+'/rest/v1/rpc/resto_cmd_suivi',{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPA_KEY},body:JSON.stringify({p_id:ID,p_tk:TK})});
    if(!r.ok)throw new Error('http');const j=await r.json();
    if(j&&j.ok)C=j;else if(!C||!C.ok)C={ok:false,raison:(j&&j.raison)||'attente'}}
  catch(e){if(!C)C={ok:false,raison:'reseau'};else C.horsLigne=true;return}
  if(C)C.horsLigne=false}

function etat(c){if(c.statut==='prete')return'prete';if(c.statut==='servie')return'servie';if(c.statut==='annule')return'annule';return'cuisine'}

function draw(){const A=$('app');if(!C){return}
  const son=!sonOk&&!(C.ok&&['servie','annule'].includes(etat(C)))?`<button class="son" onclick="unlock()">🔔 Touchez ici pour entendre quand c'est prêt</button>`:'';
  if(!C.ok){
    const cherche=C.raison==='attente'&&Date.now()-t0<3*60000;
    A.innerHTML=cherche?`<div class="card"><div class="lbl">Votre commande</div><div class="etat prep dots">On cherche votre commande</div><div class="note" style="margin-top:12px">Elle vient d'être enregistrée à la caisse. Ça prend quelques secondes.</div></div>`
      :C.raison==='reseau'?`<div class="card"><div class="etat bad">Pas de connexion internet<small>La page réessaie toute seule.</small></div></div>`
      :C.raison==='ancienne'?`<div class="card"><div class="etat fini">Cette commande est terminée.<small>Merci et à bientôt !</small></div></div>`
      :`<div class="card"><div class="etat bad">Commande introuvable<small>Demandez votre numéro à la caisse.</small></div></div>`;
    return}
  if(C.resto){$('resto').textContent=C.resto;document.title='Ma commande – '+C.resto}
  const e=etat(C),table=C.type==='place'&&C.table;
  const msg={cuisine:`<div class="etat prep">🔥 En préparation<small>Restez ici : la page vous prévient quand c'est prêt.</small></div>`,
    prete:`<div class="etat ok">✅ Votre commande est prête !<small>${table?'Le serveur vous l\'apporte à la table '+esc(C.table)+'.':'Venez la récupérer au comptoir.'}</small></div>`,
    servie:`<div class="etat fini">Bon appétit ! 😋<small>Merci et à bientôt.</small></div>`,
    annule:`<div class="etat bad">Commande annulée<small>Demandez à la caisse.</small></div>`}[e];
  const st=(k,l,ic)=>{const ord=['recue','cuisine','prete'],ix=ord.indexOf(k),cur=e==='servie'||e==='prete'?3:ord.indexOf(e==='annule'?'recue':e);return`<div class="step ${ix<cur?'done':ix===cur?'on':''}"><i>${ix<cur?'✓':ic}</i>${l}</div>`};
  A.innerHTML=`${son}<div class="card ${e==='prete'?'pret':''}${e==='prete'&&prev!=='prete'&&prev?' flash':''}">
    <div class="lbl">Votre numéro</div><div class="num">${esc(C.n)}</div>
    <div class="sub">${C.type==='emporter'?'À emporter':C.type==='place'?'Sur place'+(table?' · Table '+esc(C.table):''):C.type==='livraison'?'Livraison':''}</div>
    ${e!=='annule'?`<div class="steps">${st('recue','Reçue','1')}${st('cuisine','En préparation','2')}${st('prete','Prête','3')}</div>`:''}
    ${msg}</div>
    ${C.horsLigne?`<div class="note" style="color:var(--bad)">Pas de connexion : la page réessaie toute seule.</div>`:''}
    ${e==='cuisine'?`<div class="note">Gardez cette page ouverte. Vous pouvez aussi regarder l'écran du restaurant.</div>`:''}
    ${DEMO?`<div class="demo">Exemple : la commande devient « prête » après 20 secondes</div>`:''}`;
  document.title=(e==='prete'?'✅ Prête · ':'')+'n°'+C.n+(C.resto?' – '+C.resto:'');
}

async function tour(){clearTimeout(timer);await lire();
  if(C&&C.ok){const e=etat(C);
    if(e==='prete'&&prev&&prev!=='prete'){ding();try{navigator.vibrate&&navigator.vibrate([300,150,300,150,600])}catch(x){}
      setTimeout(()=>parler('Votre commande numéro '+C.n+' est prête.'),900)}
    draw();prev=e;if(e==='servie'||e==='annule')return}
  else draw();
  if(C&&!C.ok&&!['attente','reseau'].includes(C.raison))return;
  if(C&&!C.ok&&C.raison==='attente'&&Date.now()-t0>3*60000)return;
  if(Date.now()-t0>6*3600000)return;
  timer=setTimeout(tour,document.visibilityState==='hidden'?15000:4000)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){veille();tour()}});
tour();
</script>
</body>
</html>
